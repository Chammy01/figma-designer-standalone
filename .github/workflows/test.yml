name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Run npm contracts with child-process failure details
        shell: pwsh
        run: |
          $testScript = (Get-Content package.json -Raw | ConvertFrom-Json).scripts.test
          $testFiles = $testScript -replace '^node --test ', ''
          & node --test --test-reporter=tap @($testFiles -split ' ')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install local Chromium for browser regressions
        run: npx playwright install chromium
      - name: Browser routing and semantic motion regressions
        run: npm run test:browser
      - name: JSON, syntax, release-engineering self-checks
        shell: pwsh
        run: ./scripts/release-check.ps1 -Mode Source
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
        working-directory: vendor/figma-mcp/plugin
      - run: bun test
        working-directory: vendor/figma-mcp/plugin
      - run: bun test scripts/figma-hardening.test.ts scripts/figma-variants.test.ts scripts/figma-live-source.test.ts
      - name: Build plugin from pinned dependencies
        run: bun run build
        working-directory: vendor/figma-mcp/plugin
      - name: Built plugin dispatcher regression
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath vendor/figma-mcp/plugin/dist/code.js -PathType Leaf)) {
            throw 'Plugin build did not produce dist/code.js.'
          }
          $approved = Get-Content -LiteralPath docs/APPROVED_RUNTIME.json -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath vendor/figma-mcp/plugin/dist/code.js -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $approved.sha256.'vendor/figma-mcp/plugin/dist/code.js') {
            throw 'Built dispatcher differs from the approved release hash.'
          }
          $env:FIGMA_PLUGIN_BUNDLE = (Resolve-Path vendor/figma-mcp/plugin/dist/code.js).Path
          bun test scripts/figma-hardening.test.ts scripts/figma-variants.test.ts scripts/figma-live-source.test.ts
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: vendor/figma-mcp/go.sum
      - run: go test -count=1 ./...
        working-directory: vendor/figma-mcp
      - run: go vet ./...
        working-directory: vendor/figma-mcp
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install compatible OpenCode on disposable runner
        run: npm install --global @opencode/cli@2.0.24
      - name: Real clean source archive and release setup regression
        shell: pwsh
        run: |
          try { ./scripts/source-bootstrap.test.ps1 -OutputRoot "${{ runner.temp }}/Source bootstrap acceptance" }
          catch {
            Get-Content "${{ runner.temp }}/Source bootstrap acceptance/source-setup.txt" -Tail 60 -ErrorAction SilentlyContinue
            throw
          }
  desktop:
    needs: [node-contracts, plugin, go]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build the exact approved MCP/plugin
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'; $env:GOOS = 'windows'; $env:GOARCH = 'amd64'
          $env:GOFLAGS = ''; $env:GOWORK = 'off'; $env:GOTOOLCHAIN = 'local'; $env:GOENV = 'off'; $env:GOAMD64 = 'v1'
          New-Item bin -ItemType Directory -Force | Out-Null
          Push-Location vendor/figma-mcp
          go build -trimpath -buildvcs=false -ldflags '-X main.version=1.1.0' -o ../../bin/figma-designer-mcp.exe ./cmd/figma-mcp-go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location plugin
          bun install --frozen-lockfile
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - run: npm run test:desktop
      - run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/desktop-validate.mjs
      - name: Packaged launch, single instance and force-close process ownership
        run: node scripts/desktop-smoke.mjs
      - name: Per-user installer, upgrade, uninstall and portable extraction
        shell: pwsh
        run: |
          $target = Join-Path ([IO.Path]::GetTempPath()) 'Figma Designer café acceptance'
          ./scripts/desktop-package.test.ps1 -Phase RejectLongPath -InstallRoot (Join-Path ([IO.Path]::GetTempPath()) ('Figma Designer ' + ('x' * 100)))
          ./scripts/desktop-package.test.ps1 -Phase Install -InstallRoot $target
          ./scripts/desktop-package.test.ps1 -Phase Upgrade -InstallRoot $target
          ./scripts/desktop-package.test.ps1 -Phase Uninstall -InstallRoot $target
          ./scripts/desktop-package.test.ps1 -Phase Portable -InstallRoot (Join-Path ([IO.Path]::GetTempPath()) 'Portable café with spaces')
          node scripts/desktop-smoke.mjs (Join-Path ([IO.Path]::GetTempPath()) 'Portable café with spaces/Figma Designer.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Figma-Designer-v1.5.0-source-Windows-Candidate
          path: |
            release-staging/desktop/Figma-Designer-v1.5.0-source-Windows-Setup.exe
            release-staging/desktop/Figma-Designer-v1.5.0-source-Windows-Portable.zip
            release-staging/desktop/SHA256SUMS.txt
            release-staging/desktop/DESKTOP_PACKAGE_*.json
